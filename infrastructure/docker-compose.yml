# Scale-out infrastructure (V2). V1 runs on DuckDB + local Parquet only —
# this compose stack is the documented target for the lakehouse + vector + graph
# layers, and is not required to run the foundation.
#
#   docker compose -f infrastructure/docker-compose.yml up -d

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    environment:
      MINIO_ROOT_USER: agrilake
      MINIO_ROOT_PASSWORD: change-me-please
    volumes:
      - minio-data:/data

  # Create the bronze/silver/gold buckets on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 agrilake change-me-please &&
      mc mb --ignore-existing local/bronze local/silver local/gold &&
      exit 0"

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: agrilake
      POSTGRES_PASSWORD: change-me-please
      POSTGRES_DB: agrilake
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # HTTP API
    volumes:
      - qdrant-data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/change-me-please
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data

volumes:
  minio-data:
  pg-data:
  qdrant-data:
  neo4j-data:
