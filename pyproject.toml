[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrilake"
version = "0.1.0"
description = "Krushiverse / Agri Intelligence Lake - India-first agriculture data lake foundation (medallion architecture, ontologies, source registry, quality scoring)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AIKrishiDataLakeAgent" }]
keywords = ["agriculture", "india", "data-lake", "ontology", "rag", "farmer-qa"]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
agrilake-seed = "scripts.seed_lake:main"
agrilake-ingest = "scripts.ingest_live:main"
# full production run: discover -> collect -> quality gate -> watermark -> gaps
agrilake-pipeline = "scripts.pipeline_run:main"
agrilake-validate = "scripts.validate:main"
agrilake-build-gold = "scripts.build_gold:main"
agrilake-gen-schema = "scripts.gen_json_schema:main"
agrilake-build-graph = "scripts.build_graph:main"
agrilake-diagnose = "scripts.diagnose:main"
agrilake-fertilizer = "scripts.fertilizer:main"
agrilake-mandi = "scripts.mandi:main"
agrilake-weather = "scripts.weather:main"
agrilake-plan = "scripts.crop_plan:main"
agrilake-retrieve = "scripts.retrieve:main"
agrilake-serve = "apps.api.main:main"
agrilake-export-graph = "scripts.export_graph:main"
agrilake-vision = "scripts.analyze_image:main"
agrilake-gateway = "reasoning.gateway:main"
agrilake-benchmark-gateway = "scripts.benchmark_gateway:main"
agrilake-bootstrap = "scripts.bootstrap:main"
agrilake-build-medallion = "scripts.build_medallion:main"
agrilake-build-research = "scripts.build_research_corpus:main"
agrilake-eval-nlu = "scripts.eval_nlu:main"
agrilake-eval-reranker = "scripts.eval_reranker:main"
agrilake-import-lgd = "scripts.import_lgd:main"
agrilake-ingest-research = "scripts.ingest_research:main"
agrilake-load-test = "scripts.load_test:main"
agrilake-train-reranker = "scripts.train_reranker:main"
agrilake-verify-seeds = "scripts.verify_seeds:main"

[tool.setuptools]
packages = [
    "connectors",
    "connectors.government",
    "connectors.research",
    "connectors.web",
    "connectors.vision",
    "pipelines",
    "domain",
    "ontology",
    "knowledge_graph",
    "reasoning",
    "schemas",
    "scripts",
    "apps",
    "apps.api",
    "vision",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
